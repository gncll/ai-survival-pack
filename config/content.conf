# AI Survival Pack content list.
# Format: <kiwix-folder> <file-name-prefix>  # note
# Folders live at https://download.kiwix.org/zim/
# Lines starting with # are skipped. Order = download priority.
# Default set fits ~12 GB. Uncomment the "Large" lines if you have an external SSD.

# --- Health / first aid ---
zimit           nhs.uk_en_medicines                   # 15 MB   medicines A-Z
zimit           irp.fas.org_en_military-medicine      # 62 MB   military field medicine
other           zimgit-medicine_en                    # 67 MB   medical books (PDF)
wikipedia       wikipedia_en_medicine_nopic           # 1.0 GB  WikiMed, no images

# --- Survival ---
other           zimgit-water_en                       # 20 MB   water treatment (PDF)
other           zimgit-knots_en                       # 27 MB   knots (PDF)
other           zimgit-food-preparation_en            # 93 MB   food storage (PDF)
stack_exchange  outdoors.stackexchange.com_en_all     # 135 MB  outdoors and camping Q&A
other           zimgit-post-disaster_en               # 615 MB  post-disaster library (PDF)
zimit           solar.lowtechmagazine.com_mul_all     # 668 MB  low-tech solutions
zimit           ready.gov_en_all                      # 1.9 GB  US disaster preparedness

# --- Encyclopedia ---
wikipedia       wikipedia_tr_top_nopic                # 591 MB  best of Turkish Wikipedia, no images
wikipedia       wikipedia_en_top_nopic                # 2.6 GB  best of English Wikipedia, no images

